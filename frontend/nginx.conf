server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SIPANTAU AI APIs (Gemini) — must be before SIAGAPIM /api
    location /sipantau/api/ {
        proxy_pass http://panten:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SIPANTAU SPA (listening / intel)
    location /sipantau/ {
        proxy_pass http://panten:3000/sipantau/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sipantau {
        return 302 /sipantau/;
    }

    # Legacy redirects from old /panten path
    location /panten/ {
        return 302 /sipantau/;
    }
    location = /panten {
        return 302 /sipantau/;
    }

    # SIAGAPIM SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SIAGAPIM Flask API
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
