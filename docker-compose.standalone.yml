# SIAGAPIM + SIPANTAU — standalone (include Postgres)
# Usage: docker compose -f docker-compose.standalone.yml --env-file .env.standalone up -d --build
#
# URLs (satu pintu nginx :8080):
#   SIAGAPIM   http://localhost:8080/
#   SIPANTAU   http://localhost:8080/sipantau/   (SSO via sb_token)

services:
  db:
    image: postgres:16-alpine
    container_name: siagapim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siagapim}
      POSTGRES_USER: ${POSTGRES_USER:-siagapim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siagapim_dev_change_me}
    volumes:
      - siagapim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siagapim} -d ${POSTGRES_DB:-siagapim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siagapim

  ollama:
    image: ollama/ollama:latest
    container_name: siagapim-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - siagapim

  ollama-init:
    image: ollama/ollama:latest
    container_name: siagapim-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        MODEL="$${OLLAMA_MODEL:-llama3.2:1b}"
        echo "[ollama-init] pulling $$MODEL ..."
        ollama pull "$$MODEL"
        echo "[ollama-init] ready"
    networks:
      - siagapim
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siagapim-api
    restart: unless-stopped
    env_file:
      - .env.standalone
    environment:
      RUN_SEED: ${RUN_SEED:-true}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-siagapim}:${POSTGRES_PASSWORD:-siagapim_dev_change_me}@db:5432/${POSTGRES_DB:-siagapim}
      SIPANTAU_INTERNAL_URL: http://panten:3000
      SIPANTAU_INTERNAL_KEY: ${SIPANTAU_INTERNAL_KEY:-sipantau-dev-internal-key}
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - siagapim

  panten:
    build:
      context: ../Panten
      dockerfile: Dockerfile
      args:
        VITE_BASE: /sipantau/
        VITE_SIAGAPIM_URL: /
        VITE_PANTEN_API_BASE: /sipantau/api
        VITE_SIPANTAU_API_BASE: /sipantau/api
    container_name: siagapim-panten
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_BASE: /sipantau/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_ENRICH: ${OLLAMA_ENRICH:-true}
      OLLAMA_ENRICH_LIMIT: ${OLLAMA_ENRICH_LIMIT:-8}
      DATABASE_URL: postgresql://siagapim:${POSTGRES_PASSWORD:-siagapim_dev_change_me}@db:5432/${POSTGRES_DB:-siagapim}
      SIAGAPIM_INTERNAL_URL: http://backend:5001
      SIAGAPIM_WEBHOOK_URL: http://backend:5001/api/mata-bathin/webhook/alert
      SIAGAPIM_WEBHOOK_KEY: ${MATA_BATHIN_API_KEY:-}
      SIPANTAU_INTERNAL_KEY: ${SIPANTAU_INTERNAL_KEY:-sipantau-dev-internal-key}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-300000}
      INGEST_ADAPTER: ${INGEST_ADAPTER:-auto}
      INGEST_LIMIT: ${INGEST_LIMIT:-50}
      GEMINI_ALLOW_STUB_FALLBACK: ${GEMINI_ALLOW_STUB_FALLBACK:-false}
      GEMINI_INGEST_MODEL: ${GEMINI_INGEST_MODEL:-gemini-3.6-flash}
      OPENAI_INGEST_MODEL: ${OPENAI_INGEST_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - siagapim

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siagapim-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      panten:
        condition: service_healthy
    networks:
      - siagapim

networks:
  siagapim:
    driver: bridge

volumes:
  siagapim_pgdata:
  ollama_data:
